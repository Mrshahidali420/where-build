name: Instagram reel test
run-name: Instagram reel test (${{ inputs.kind }} ${{ inputs.number }}, post=${{ inputs.post }})

# Sends one clip from the recap project's store to Instagram by hand, and prints every answer in full, so a
# refused upload shows its real reason. post=false stops before the post (the video is only sent and checked).
on:
  workflow_dispatch:
    inputs:
      number:
        description: 'Which clip of the list (1 = the first)'
        default: '1'
      kind:
        description: 'short (60 s) or full'
        default: 'short'
      version:
        description: 'Graph API version'
        default: 'v21.0'
      ctype:
        description: 'true = send a Content-Type header with the bytes'
        type: boolean
        default: false
      mode:
        description: 'upload (send the bytes) or url (host the video on the Page, give Instagram the link)'
        default: 'upload'
      seconds:
        description: 'Cut the clip to this many seconds first (0 = whole clip)'
        default: '0'
      crf:
        description: 'x264 quality when re-encoding (higher = smaller file)'
        default: '20'
      start:
        description: 'Start of the cut, in seconds'
        default: '0'
      regop:
        description: 'true = first re-encode with a fixed 2-second keyframe gap (Instagram wants a closed GOP of 2 to 5 s)'
        type: boolean
        default: true
      post:
        description: 'true = publish it for real'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Send the clip
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_TOKEN: ${{ secrets.CLIPS_TOKEN }}
          NUMBER: ${{ inputs.number }}
          KIND: ${{ inputs.kind }}
          POST: ${{ inputs.post }}
          REGOP: ${{ inputs.regop }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
          CRF: ${{ inputs.crf }}
          SECONDS_LIMIT: ${{ inputs.seconds }}
          CTYPE: ${{ inputs.ctype }}
        run: |
          set -u
          api="https://graph.facebook.com/$VERSION"
          item=$(gh api repos/${{ github.repository_owner }}/recap-assets/contents/clips/whereanime.json -H 'Accept: application/vnd.github.raw' | jq -c ".items | sort_by(.made_at) | .[$NUMBER-1]")
          echo "clip: $(echo "$item" | jq -r .id)"
          id=$(echo "$item" | jq -r ".${KIND}_id")
          gh api "repos/${{ github.repository_owner }}/recap-assets/releases/assets/$id" -H 'Accept: application/octet-stream' > clip.mp4
          if [ "$REGOP" = "true" ] || [ "$SECONDS_LIMIT" != "0" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
            ffmpeg -v error -y -ss $START $( [ "$SECONDS_LIMIT" != "0" ] && echo "-t $SECONDS_LIMIT" ) -i clip.mp4 -c:v libx264 -preset medium -crf $CRF -pix_fmt yuv420p -r 30 -g 60 -keyint_min 60 -sc_threshold 0 -flags +cgop -c:a aac -b:a 160k -ar 48000 -ac 2 -movflags +faststart fixed.mp4 && mv fixed.mp4 clip.mp4
          fi
          size=$(stat -c %s clip.mp4); echo "size: $size bytes"
          ig=$(curl -fsS "$api/$FB_PAGE_ID?fields=instagram_business_account&access_token=$FB_PAGE_TOKEN" | jq -r '.instagram_business_account.id')
          caption=$(echo "$item" | jq -r .title)
          if [ "$MODE" = "url" ]; then
            echo "--- host the video on the Page (unpublished)"
            hosted=$(curl -sS -X POST "$api/$FB_PAGE_ID/videos" -F "published=false" -F "source=@clip.mp4" -F "access_token=$FB_PAGE_TOKEN")
            echo "hosted: $(echo "$hosted" | jq -c .)"
            vid=$(echo "$hosted" | jq -r .id)
            src=""
            for i in $(seq 1 40); do
              r=$(curl -sS "$api/$vid?fields=source,status&access_token=$FB_PAGE_TOKEN")
              src=$(echo "$r" | jq -r '.source // empty')
              echo "$i: $(echo "$r" | jq -c '{status: .status.video_status, has_source: (.source != null)}')"
              [ -n "$src" ] && break
              sleep 10
            done
            made=$(curl -sS -X POST "$api/$ig/media" -d "media_type=REELS" --data-urlencode "video_url=$src" --data-urlencode "caption=$caption" -d "share_to_feed=true" -d "access_token=$FB_PAGE_TOKEN")
            echo "container: $(echo "$made" | jq -c .)"
            cid=$(echo "$made" | jq -r .id)
          else
            made=$(curl -sS -X POST "$api/$ig/media" -d "media_type=REELS" -d "upload_type=resumable" --data-urlencode "caption=$caption" -d "share_to_feed=true" -d "access_token=$FB_PAGE_TOKEN")
            echo "container: $(echo "$made" | jq -c 'del(.access_token)')"
            cid=$(echo "$made" | jq -r .id); uri=$(echo "$made" | jq -r .uri)
            echo "--- upload"
            curl -sS -w '\nHTTP %{http_code}\n' -X POST "$uri" -H "Authorization: OAuth $FB_PAGE_TOKEN" -H "offset: 0" -H "file_size: $size" -H "Content-Type: application/octet-stream" --data-binary @clip.mp4
          fi
          echo "--- status"
          for i in $(seq 1 30); do
            s=$(curl -sS "$api/$cid?fields=status_code,status&access_token=$FB_PAGE_TOKEN")
            echo "$i: $s"
            case "$s" in *FINISHED*|*ERROR*|*EXPIRED*) break;; esac
            sleep 10
          done
          if [ "$POST" = "true" ] && echo "$s" | grep -q FINISHED; then
            echo "--- publish"
            curl -sS -X POST "$api/$ig/media_publish" -d "creation_id=$cid" -d "access_token=$FB_PAGE_TOKEN"; echo
          fi
