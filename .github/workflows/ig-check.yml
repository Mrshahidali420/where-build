name: Instagram check
run-name: Instagram check (read only)

# Lists what is really on the site's Instagram account, straight from Instagram, so the ledger can be
# compared with it. Reads only. Posts nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List the Instagram posts by kind and the publishing quota
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          api="https://graph.facebook.com/v26.0"
          ig=$(curl -fsS "$api/$FB_PAGE_ID?fields=instagram_business_account&access_token=$FB_PAGE_TOKEN" | jq -r '.instagram_business_account.id')
          echo "account: $ig"
          curl -fsS "$api/$ig?fields=username,media_count&access_token=$FB_PAGE_TOKEN" | jq -c .
          all=$(curl -fsS "$api/$ig/media?fields=media_type,media_product_type,timestamp,permalink&limit=100&access_token=$FB_PAGE_TOKEN")
          echo "--- posts by day and kind"
          echo "$all" | jq -r '.data | group_by(.timestamp[0:10] + .media_type + .media_product_type)[] | .[0].timestamp[0:10] + " " + .[0].media_type + " " + .[0].media_product_type + " x" + (length|tostring)'
          echo "--- every video or reel"
          echo "$all" | jq -r '.data[] | select(.media_type != "IMAGE" and .media_type != "CAROUSEL_ALBUM") | [.timestamp, .media_type, .media_product_type, .permalink] | @tsv'
          echo "--- publishing quota"
          curl -sS "$api/$ig/content_publishing_limit?fields=quota_usage,config&access_token=$FB_PAGE_TOKEN" | jq -c .
