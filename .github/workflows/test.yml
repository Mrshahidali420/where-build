name: Tests

# The only workflow that runs on push to master. Everything that touches
# R2 or AniList (ingest-credits.yml, ingest-airing.yml, backfill-staff.yml)
# is schedule- or hand-triggered only.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - run: npm test
